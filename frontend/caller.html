<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VoiceGuard — Caller</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <main class="wrap">
    <h1>Caller</h1>
    <p>Shares mic audio with the receiver over WebRTC. Open <a href="/receiver.html">the receiver</a>
      in another tab (or device), use the same room code.</p>

    <section class="panel">
      <label>Room code
        <input id="room" value="demo" autocomplete="off" />
      </label>
      <button id="start">Start mic &amp; connect</button>
      <p id="status" class="status">idle</p>
    </section>
  </main>
  <script src="/static/js/webrtc.js"></script>
  <script src="/static/js/caller.js"></script>
</body>
</html>
